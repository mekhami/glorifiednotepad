name: CI / Deploy

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch, tag, or SHA) to build and deploy"
        required: true
        default: main

env:
  ELIXIR_VERSION: "1.19.4"
  OTP_VERSION: "28.2"
  REF: ${{ inputs.ref || github.sha }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: indie
          POSTGRES_PASSWORD: indie
          POSTGRES_DB: indie_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U indie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build/test
          key: test-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: test-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix deps.unlock --check-unused
      - run: mix test

  build:
    name: Build release
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: prod
      IMAGE_CACHE_PATH: ${{ github.workspace }}/.image-cache

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Install image optimization tools
        run: sudo apt-get update && sudo apt-get install -y pngquant jpegoptim optipng webp

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build/prod
          key: prod-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: prod-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - uses: actions/cache@v4
        with:
          path: .image-cache
          key: images-${{ hashFiles('priv/static/images/**') }}
          restore-keys: images-

      - run: mix deps.get --only prod
      - run: mix compile
      - run: mix assets.setup
      - run: npm ci
        working-directory: assets
      - run: mix assets.deploy
      - run: mix release --overwrite

      - name: Stage tarball named by commit SHA
        id: commit
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp _build/prod/indie-*.tar.gz "out/indie-$SHA.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: out/*.tar.gz
          retention-days: 14

    outputs:
      sha: ${{ steps.commit.outputs.sha }}

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: out

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName ${{ secrets.SSH_HOST }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Upload release and scripts
        run: |
          SHA="${{ needs.build.outputs.sha }}"
          ssh prod "mkdir -p /opt/indie/incoming /opt/indie/bin"
          scp "out/indie-$SHA.tar.gz" "prod:/opt/indie/incoming/"
          scp deployment/activate_release.sh deployment/rollback.sh prod:/opt/indie/bin/
          ssh prod "chmod +x /opt/indie/bin/*.sh"

      - name: Activate release
        run: ssh prod "/opt/indie/bin/activate_release.sh /opt/indie/incoming/indie-${{ needs.build.outputs.sha }}.tar.gz ${{ needs.build.outputs.sha }}"
