<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" fill="#1a1a1a"/>
  
  <!-- Pixel grid pattern - RSS-inspired design -->
  <!-- Top left corner - RSS wave pattern -->
  <rect x="4" y="20" width="4" height="4" fill="#ff6b35"/>
  <rect x="8" y="16" width="4" height="4" fill="#ff6b35"/>
  <rect x="12" y="12" width="4" height="4" fill="#ff6b35"/>
  <rect x="16" y="8" width="4" height="4" fill="#ff6b35"/>
  
  <!-- Accent pixels -->
  <rect x="4" y="24" width="4" height="4" fill="#ff6b35"/>
  <rect x="8" y="24" width="4" height="4" fill="#ff8c5a"/>
  <rect x="12" y="24" width="4" height="4" fill="#ff8c5a"/>
  
  <!-- Grid highlight pixels -->
  <rect x="20" y="4" width="4" height="4" fill="#4a9eff"/>
  <rect x="24" y="8" width="4" height="4" fill="#4a9eff"/>
  <rect x="24" y="20" width="4" height="4" fill="#4a9eff"/>
  <rect x="20" y="24" width="4" height="4" fill="#4a9eff"/>
</svg>
