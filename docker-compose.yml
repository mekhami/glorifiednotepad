services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: indie
      POSTGRES_PASSWORD: indie
      POSTGRES_DB: indie_dev
    ports:
      - "5433:5432"
    volumes:
      - indie_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indie -d indie_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  indie_postgres_data: